name: C++23 Automated CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down your source code repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up a Docker build environment
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build the environment container using your Dockerfile
      - name: Build Environment Container
        run: docker build -t cpp23-env .

      # 4. Wipe stale artifacts and compile the main application in release mode
      - name: Compile Application (Release Mode)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace cpp23-env bash -c "make clean && make all DEBUG=0"

      # 5. Start MariaDB, provision test DB, generate creds/dbcreds.txt, and run debug tests
      - name: Run All Google Test Suites (Debug Mode)
        env:
          TEST_DB_PASS: ${{ secrets.AA_TEST_DB_PASSWORD }}
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -e TEST_DB_PASS="${TEST_DB_PASS}" cpp23-env bash -c '
            set -e
            service mariadb start
            mariadb -u root <<SQL
            CREATE DATABASE IF NOT EXISTS auto_assignment_test;
            CREATE USER IF NOT EXISTS '\''aa_test'\''@'\''127.0.0.1'\'' IDENTIFIED BY '\''${TEST_DB_PASS}'\'';
            CREATE USER IF NOT EXISTS '\''aa_test'\''@'\''localhost'\'' IDENTIFIED BY '\''${TEST_DB_PASS}'\'';
            GRANT ALL PRIVILEGES ON auto_assignment_test.* TO '\''aa_test'\''@'\''127.0.0.1'\'';
            GRANT ALL PRIVILEGES ON auto_assignment_test.* TO '\''aa_test'\''@'\''localhost'\'';
            FLUSH PRIVILEGES;
            SQL
            mkdir -p creds
            printf "SERVER=127.0.0.1,USER=aa_test,PASSWORD=%s,DATABASE=auto_assignment_test\n" "${TEST_DB_PASS}" > creds/dbcreds.txt
            chmod 600 creds/dbcreds.txt
            make clean && make run_all DEBUG=1
          '

